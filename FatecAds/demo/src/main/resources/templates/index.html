<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fatec ADS</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>Fatec ADS</h1>
        </div>
    </div>

    <div class="container">
        <p class="subtitle">Selecione uma das opcoes abaixo para gerenciar o sistema.</p>

        <div class="cards">
            <a href="/alunos/listar" class="card">
                <div class="card-title">Alunos</div>
                <div class="card-desc">Gerenciar alunos cadastrados</div>
            </a>
            <a href="/cursos/listar" class="card">
                <div class="card-title">Cursos</div>
                <div class="card-desc">Gerenciar cursos disponíveis</div>
            </a>
            <a href="/professores/listar" class="card">
                <div class="card-title">Professores</div>
                <div class="card-desc">Gerenciar corpo docente</div>
            </a>
            <a href="/disciplinas/listar" class="card">
                <div class="card-title">Disciplinas</div>
                <div class="card-desc">Gerenciar disciplinas ofertadas</div>
            </a>
        </div>
    </div>
</body>
</html>
