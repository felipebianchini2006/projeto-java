spring.application.name=demo

# H2 Database
spring.datasource.url=jdbc:h2:mem:fatecads
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# Resend
# Configure essas variaveis no ambiente, sem salvar a chave no codigo.
resend.api-key=${RESEND_API_KEY:}
resend.from=${RESEND_FROM_EMAIL:Fatec ADS <noreply@felipeb.tech>}
resend.api-url=https://api.resend.com
