<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Alunos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>Fatec ADS</h1>
            <nav>
                <a th:href="@{/fatecads}">Inicio</a>
                <th:block th:replace="~{fragments/menu-usuario :: menu}"></th:block>
            </nav>
        </div>
    </div>

    <div class="container">
        <h2 class="page-title">Alunos</h2>

        <div class="actions-bar">
            <a th:href="@{/alunos/novo}" class="btn btn-primary">Novo aluno</a>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Email</th>
                        <th>Telefone</th>
                        <th>Endereco</th>
                        <th>CPF</th>
                        <th>RA</th>
                        <th>Curso</th>
                        <th>Acoes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="aluno : ${listaAlunos}">
                        <td th:text="${aluno.idAluno}">1</td>
                        <td th:text="${aluno.nomeAluno}">Nome</td>
                        <td th:text="${aluno.emailAluno}">email@exemplo.com</td>
                        <td th:text="${aluno.telefoneAluno}">(11) 99999-9999</td>
                        <td th:text="${aluno.enderecoAluno}">Rua A</td>
                        <td th:text="${aluno.cpfAluno}">00000000000</td>
                        <td th:text="${aluno.raAluno}">123456</td>
                        <td th:text="${aluno.curso != null ? aluno.curso.nomeCurso : 'Nao informado'}">Curso</td>
                        <td>
                            <div class="td-actions">
                                <a th:href="@{/alunos/editar/{id}(id=${aluno.idAluno})}" class="btn btn-edit">Editar</a>
                                <form th:action="@{/alunos/excluir/{id}(id=${aluno.idAluno})}"
                                      method="post"
                                      onsubmit="return confirm('Deseja excluir este aluno?');">
                                    <button type="submit" class="btn btn-danger">Excluir</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
