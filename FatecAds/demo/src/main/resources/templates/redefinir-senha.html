<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>Fatec ADS</h1>
            <nav>
                <a th:href="@{/login}">Login</a>
            </nav>
        </div>
    </div>

    <div class="container">
        <h2 class="page-title">Redefinir senha</h2>

        <div class="form-card">
            <form th:action="@{/redefinir-senha}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <input type="hidden" name="token" th:value="${token}">

                <div class="form-group">
                    <label for="senha">Nova senha</label>
                    <input id="senha" type="password" name="senha" required minlength="6" autofocus>
                </div>

                <div class="form-group">
                    <label for="confirmarSenha">Confirmar nova senha</label>
                    <input id="confirmarSenha" type="password" name="confirmarSenha" required minlength="6">
                </div>

                <p class="subtitle" th:if="${erro}" th:text="${erro}"></p>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar senha</button>
                    <a th:href="@{/login}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
