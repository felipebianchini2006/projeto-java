<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Disciplinas</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>Fatec ADS</h1>
            <nav>
                <a th:href="@{/fatecads}">Inicio</a>
            </nav>
        </div>
    </div>

    <div class="container">
        <h2 class="page-title">Disciplinas</h2>

        <div class="actions-bar">
            <a th:href="@{/disciplinas/novo}" class="btn btn-primary">Nova disciplina</a>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Sigla</th>
                        <th>Carga Horaria</th>
                        <th>Acoes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="disciplina : ${listaDisciplinas}">
                        <td th:text="${disciplina.idDisciplina}">1</td>
                        <td th:text="${disciplina.nomeDisciplina}">Nome</td>
                        <td th:text="${disciplina.siglaDisciplina}">SIG</td>
                        <td th:text="${disciplina.cargaHorariaDisciplina}">80</td>
                        <td>
                            <div class="td-actions">
                                <a th:href="@{/disciplinas/editar/{id}(id=${disciplina.idDisciplina})}" class="btn btn-edit">Editar</a>
                                <form th:action="@{/disciplinas/excluir/{id}(id=${disciplina.idDisciplina})}"
                                      method="post"
                                      onsubmit="return confirm('Deseja excluir esta disciplina?');">
                                    <button type="submit" class="btn btn-danger">Excluir</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
