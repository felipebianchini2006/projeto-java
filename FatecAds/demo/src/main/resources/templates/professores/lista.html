<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Professores</title>
</head>
<body>
    <h1>Lista de Professores</h1>

    <p>
        <a th:href="@{/professores/novo}">Novo professor</a>
        |
        <a th:href="@{/fatecads}">Página inicial</a>
    </p>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nome</th>
                <th>Telefone</th>
                <th>Graduação</th>
                <th>RM</th>
                <th>Ações</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="professor : ${listaProfessores}">
                <td th:text="${professor.idProfessor}">1</td>
                <td th:text="${professor.nomeProfessor}">Nome</td>
                <td th:text="${professor.telefoneProfessor}">(11) 99999-9999</td>
                <td th:text="${professor.graduacaoProfessor}">Mestrado</td>
                <td th:text="${professor.rmProfessor}">123456</td>
                <td>
                    <a th:href="@{/professores/editar/{id}(id=${professor.idProfessor})}">Editar</a>
                    <form th:action="@{/professores/excluir/{id}(id=${professor.idProfessor})}"
                          method="post"
                          onsubmit="return confirm('Deseja excluir este professor?');"
                          style="display:inline;">
                        <button type="submit">Excluir</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
