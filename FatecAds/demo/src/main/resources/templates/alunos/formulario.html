<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>Fatec ADS</h1>
            <nav>
                <a th:href="@{/fatecads}">Inicio</a>
                <a th:href="@{/alunos}">Alunos</a>
            </nav>
        </div>
    </div>

    <div class="container">
        <h2 class="page-title">Cadastro de Aluno</h2>

        <div class="form-card">
            <form th:action="@{/alunos/salvar}" th:object="${aluno}" method="post">
                <input type="hidden" th:field="*{idAluno}">

                <div class="form-group">
                    <label for="nomeAluno">Nome</label>
                    <input id="nomeAluno" type="text" th:field="*{nomeAluno}" required>
                </div>

                <div class="form-group">
                    <label for="emailAluno">E-mail</label>
                    <input id="emailAluno" type="email" th:field="*{emailAluno}">
                </div>

                <div class="form-group">
                    <label for="telefoneAluno">Telefone</label>
                    <input id="telefoneAluno" type="text" th:field="*{telefoneAluno}" required>
                </div>

                <div class="form-group">
                    <label for="enderecoAluno">Endereco</label>
                    <input id="enderecoAluno" type="text" th:field="*{enderecoAluno}" required>
                </div>

                <div class="form-group">
                    <label for="cpfAluno">CPF</label>
                    <input id="cpfAluno" type="text" th:field="*{cpfAluno}" required>
                </div>

                <div class="form-group">
                    <label for="raAluno">RA</label>
                    <input id="raAluno" type="text" th:field="*{raAluno}" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a th:href="@{/alunos}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
