<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuario</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>Fatec ADS</h1>
            <nav>
                <a th:href="@{/fatecads}">Inicio</a>
                <a th:href="@{/usuarios}">Usuarios</a>
            </nav>
        </div>
    </div>

    <div class="container">
        <h2 class="page-title">Cadastro de Usuario</h2>

        <div class="form-card">
            <form th:action="@{/usuarios/salvar}" th:object="${usuario}" method="post">
                <input type="hidden" th:field="*{id}">

                <div class="form-group">
                    <label for="nome">Nome</label>
                    <input id="nome" type="text" th:field="*{nome}" required>
                </div>

                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input id="email" type="email" th:field="*{email}" required>
                </div>

                <div class="form-group">
                    <label for="login">Login</label>
                    <input id="login" type="text" th:field="*{login}" required>
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input id="senha" type="password" th:field="*{senha}" required>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
