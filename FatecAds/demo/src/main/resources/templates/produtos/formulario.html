<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Produto</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>Fatec ADS</h1>
            <nav>
                <a th:href="@{/fatecads}">Inicio</a>
                <a th:href="@{/produtos}">Produtos</a>
            </nav>
        </div>
    </div>

    <div class="container">
        <h2 class="page-title" th:text="${produto.idProduto == null ? 'Novo produto' : 'Editar produto'}">
            Produto
        </h2>

        <div class="form-card">
            <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
                <input type="hidden" th:field="*{idProduto}">

                <div class="form-group">
                    <label for="descricao">Descricao</label>
                    <input id="descricao" type="text" th:field="*{descricao}" maxlength="120" required>
                    <span class="field-error" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></span>
                </div>

                <div class="form-group">
                    <label for="valor">Valor</label>
                    <input id="valor" type="number" th:field="*{valor}" min="0.01" step="0.01" required>
                    <span class="field-error" th:if="${#fields.hasErrors('valor')}" th:errors="*{valor}"></span>
                </div>

                <div class="form-group">
                    <label for="unidade">Unidade</label>
                    <input id="unidade" type="text" th:field="*{unidade}" maxlength="20" required>
                    <span class="field-error" th:if="${#fields.hasErrors('unidade')}" th:errors="*{unidade}"></span>
                </div>

                <div class="form-group">
                    <label for="marca">Marca</label>
                    <input id="marca" type="text" th:field="*{marca}" maxlength="60" required>
                    <span class="field-error" th:if="${#fields.hasErrors('marca')}" th:errors="*{marca}"></span>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a th:href="@{/produtos}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
