<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Disciplina</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>Fatec ADS</h1>
            <nav>
                <a th:href="@{/fatecads}">Inicio</a>
                <a th:href="@{/disciplinas}">Disciplinas</a>
                <th:block th:replace="~{fragments/menu-usuario :: menu}"></th:block>
            </nav>
        </div>
    </div>

    <div class="container">
        <h2 class="page-title">Cadastro de Disciplina</h2>

        <div class="form-card">
            <form th:action="@{/disciplinas/salvar}" th:object="${disciplina}" method="post">
                <input type="hidden" th:field="*{idDisciplina}">

                <div class="form-group">
                    <label for="nomeDisciplina">Nome</label>
                    <input id="nomeDisciplina" type="text" th:field="*{nomeDisciplina}" required>
                </div>

                <div class="form-group">
                    <label for="siglaDisciplina">Sigla</label>
                    <input id="siglaDisciplina" type="text" th:field="*{siglaDisciplina}" required>
                </div>

                <div class="form-group">
                    <label for="cargaHorariaDisciplina">Carga Horaria</label>
                    <input id="cargaHorariaDisciplina" type="number" th:field="*{cargaHorariaDisciplina}" required>
                </div>

                <div class="form-group">
                    <label for="professorId">Professor</label>
                    <select id="professorId" name="professorId" required>
                        <option value="">Selecione um professor</option>
                        <option th:each="professor : ${listaProfessores}"
                                th:value="${professor.idProfessor}"
                                th:text="${professor.nomeProfessor}"
                                th:selected="${disciplina.professor != null and disciplina.professor.idProfessor == professor.idProfessor}">
                            Professor
                        </option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="cursoId">Curso</label>
                    <select id="cursoId" name="cursoId" required>
                        <option value="">Selecione um curso</option>
                        <option th:each="curso : ${listaCursos}"
                                th:value="${curso.idCurso}"
                                th:text="${curso.nomeCurso}"
                                th:selected="${disciplina.curso != null and disciplina.curso.idCurso == curso.idCurso}">
                            Curso
                        </option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Salvar</button>
                    <a th:href="@{/disciplinas}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
