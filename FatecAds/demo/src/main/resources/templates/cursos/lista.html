<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Cursos</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="header">
        <div class="container">
            <h1>Fatec ADS</h1>
            <nav>
                <a th:href="@{/fatecads}">Inicio</a>
            </nav>
        </div>
    </div>

    <div class="container">
        <h2 class="page-title">Cursos</h2>

        <div class="actions-bar">
            <a th:href="@{/cursos/novo}" class="btn btn-primary">Novo curso</a>
        </div>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Periodo</th>
                        <th>Carga Horaria</th>
                        <th>Acoes</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="curso : ${listaCursos}">
                        <td th:text="${curso.idCurso}">1</td>
                        <td th:text="${curso.nomeCurso}">Nome</td>
                        <td th:text="${curso.periodo}">6</td>
                        <td th:text="${curso.cargaHoraria}">2400</td>
                        <td>
                            <div class="td-actions">
                                <a th:href="@{/cursos/editar/{id}(id=${curso.idCurso})}" class="btn btn-edit">Editar</a>
                                <form th:action="@{/cursos/excluir/{id}(id=${curso.idCurso})}"
                                      method="post"
                                      onsubmit="return confirm('Deseja excluir este curso?');">
                                    <button type="submit" class="btn btn-danger">Excluir</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
